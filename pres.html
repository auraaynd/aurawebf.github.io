<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Skills - Aura</title>
  <link rel="stylesheet" href="dua.css">
</head>

<body>
  <div class="container">
    <div class="main-title">
      <h1>My Skills</h1>
      <p>Representasi dari kemampuan yang saya miliki.</p>
    </div>

    <div class="skills-section">
      <div class="skill-item">
        <div class="skill-info">
          <span>Cooking</span>
          <span>85%</span>
        </div>
        <div class="progress-line" data-skill="85%">
          <span style="width: 85%;"></span>
        </div>
      </div>

      <div class="skill-item">
        <div class="skill-info">
          <span>Problem Solving</span>
          <span>75%</span>
        </div>
        <div class="progress-line" data-skill="75%">
          <span style="width: 75%;"></span>
        </div>
      </div>

      <div class="skill-item">
        <div class="skill-info">
          <span>English (Communication)</span>
          <span>80%</span>
        </div>
        <div class="progress-line" data-skill="80%">
          <span style="width: 80%;"></span>
        </div>
      </div>

      <div class="skill-item">
        <div class="skill-info">
          <span>Digital Tools (Canva, Etc..)</span>
          <span>90%</span>
        </div>
        <div class="progress-line" data-skill="90%">
          <span style="width: 90%;"></span>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
