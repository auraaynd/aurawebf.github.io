<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Aura</title>
    <link rel="stylesheet" href="cntc2.css">
</head>

<body>
    <div class="container">
        <div class="contact-box">
            <div class="main-title">
                <h1>Contact Me</h1>
                <p>Punya pertanyaan? Kirim pesanmu di bawah ini!</p>
            </div>

            <form action="">
                <table width="100%" cellpadding="10" border="0">
                    <tr>
                        <td>
                            <label>Nama Anda</label><br>
                            <input type="text" name="name" placeholder="Nama Lengkap" required />
                        </td>
                        <td>
                            <label>Email</label><br>
                            <input type="email" name="email" placeholder="email@contoh.com" required />
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2">
                            <label>Pesan</label><br>
                            <textarea name="pesan" cols="50" rows="6"
                                placeholder="Halo Aura, saya ingin bertanya tentang..."></textarea>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2" align="right">
                            <input type="reset" value="Reset" class="btn-reset" />
                            <input type="submit" value="Send Message" class="btn-submit" />
                        </td>
                    </tr>
                </table>
            </form>
        </div>
    </div>
</body>

</html>
